version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: npm
    directory: /apps/backend
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: pip
    directory: /services/worker-qos
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
